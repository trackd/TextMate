name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh -NoLogo -NoProfile -NonInteractive -File "{0}"

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  validate:
    name: ${{ matrix.os }} / ${{ matrix.renderers }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        renderers: [Text, Adapters]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Prepare build tools
        run: ./.github/Initialize-Build.ps1
      - name: Build and test
        env:
          TEXTMATE_RENDERERS: ${{ matrix.renderers }}
        run: |
          if ($env:TEXTMATE_RENDERERS -eq 'Adapters') {
              ./build.ps1 -Task BuildAndTest -Renderer Spectre,Fullscreen
          }
          else {
              ./build.ps1 -Task BuildAndTest
          }
      - name: Upload module and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: textmate-${{ matrix.os }}-${{ matrix.renderers }}
          path: |
            output/
            TestResults/
          if-no-files-found: warn
